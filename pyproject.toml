[project]
name = "customcbot"
version = "0.1.0"
description = "A free, local chatbot you teach with your own PDFs, videos and notes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
    "platformdirs>=4",
    "psutil>=5.9",
    "fastembed>=0.5",
    "pypdfium2>=4.30",
    "pillow>=10",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "youtube-transcript-api>=1.0",
    "rapidocr-onnxruntime>=1.4",
    "faster-whisper>=1.1",
    "av>=12",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
customcbot = "customcbot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customcbot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
